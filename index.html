<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D&amp;D безделушки — иконки 256×256</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 44px 34px 80px; background: #14161a; color: #e9eaec;
         font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p.sub { margin: 0 0 30px; color: #949aa6; max-width: 80ch; }
  .meta { font-family: ui-monospace, Menlo, Consolas, monospace; color: #8d94a1; font-size: 12.5px; }
  .grid { display: grid; gap: 26px; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); }
  .card { margin: 0; }
  .preview { position: relative; border: 1px solid #2c3037; border-radius: 14px;
              overflow: hidden; background: #1b1e23; aspect-ratio: 1; }
  .preview img { display: block; width: 100%; height: auto; }
  .preview img.small { position: absolute; right: 12px; bottom: 12px; width: 64px;
                        height: 64px; border-radius: 6px; border: 1px solid #2c3037; }
  figcaption { display: flex; flex-direction: column; gap: 2px; padding: 12px 2px 0; }
  .name { font-weight: 600; }
</style>
</head>
<body>
  <h1>D&amp;D безделушки — иконки 256×256</h1>
  <p class="sub">Коллекция «ручная живопись»: 11 безделушек из таблицы d100 в одном стиле.
  Справа снизу — тот же файл в 64&nbsp;px для проверки читаемости; версии с прозрачным фоном
  лежат в <span class="meta">icons/painted/transparent/</span>.</p>
  <div class="grid">
      <figure class="card">
        <div class="preview">
          <img src="icons/painted/01-mummified-goblin-hand.png" alt="Мумифицированная рука гоблина">
          <img class="small" src="icons/painted/01-mummified-goblin-hand.png" alt="" width="64" height="64">
        </div>
        <figcaption>
          <span class="name">Мумифицированная рука гоблина</span>
          <span class="meta">icons/painted/01-mummified-goblin-hand.png · d100: 01</span>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="preview">
          <img src="icons/painted/02-moonlight-crystal.png" alt="Кристалл, светящийся в лунном свете">
          <img class="small" src="icons/painted/02-moonlight-crystal.png" alt="" width="64" height="64">
        </div>
        <figcaption>
          <span class="name">Кристалл, светящийся в лунном свете</span>
          <span class="meta">icons/painted/02-moonlight-crystal.png · d100: 02</span>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="preview">
          <img src="icons/painted/06-glass-chess-piece.png" alt="Старая стеклянная шахматная фигура">
          <img class="small" src="icons/painted/06-glass-chess-piece.png" alt="" width="64" height="64">
        </div>
        <figcaption>
          <span class="name">Старая стеклянная шахматная фигура</span>
          <span class="meta">icons/painted/06-glass-chess-piece.png · d100: 06</span>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="preview">
          <img src="icons/painted/07-skull-knucklebones.png" alt="Кости-«шестёрки» с черепом">
          <img class="small" src="icons/painted/07-skull-knucklebones.png" alt="" width="64" height="64">
        </div>
        <figcaption>
          <span class="name">Кости-«шестёрки» с черепом</span>
          <span class="meta">icons/painted/07-skull-knucklebones.png · d100: 07</span>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="preview">
          <img src="icons/painted/13-beast-tooth.png" alt="Зуб неизвестного зверя">
          <img class="small" src="icons/painted/13-beast-tooth.png" alt="" width="64" height="64">
        </div>
        <figcaption>
          <span class="name">Зуб неизвестного зверя</span>
          <span class="meta">icons/painted/13-beast-tooth.png · d100: 13</span>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="preview">
          <img src="icons/painted/14-dragon-scale.png" alt="Огромная чешуйка, возможно драконья">
          <img class="small" src="icons/painted/14-dragon-scale.png" alt="" width="64" height="64">
        </div>
        <figcaption>
          <span class="name">Огромная чешуйка, возможно драконья</span>
          <span class="meta">icons/painted/14-dragon-scale.png · d100: 14</span>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="preview">
          <img src="icons/painted/15-green-feather.png" alt="Ярко-зелёное перо">
          <img class="small" src="icons/painted/15-green-feather.png" alt="" width="64" height="64">
        </div>
        <figcaption>
          <span class="name">Ярко-зелёное перо</span>
          <span class="meta">icons/painted/15-green-feather.png · d100: 15</span>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="preview">
          <img src="icons/painted/17-smoke-orb.png" alt="Стеклянный шар с движущимся дымом">
          <img class="small" src="icons/painted/17-smoke-orb.png" alt="" width="64" height="64">
        </div>
        <figcaption>
          <span class="name">Стеклянный шар с движущимся дымом</span>
          <span class="meta">icons/painted/17-smoke-orb.png · d100: 17</span>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="preview">
          <img src="icons/painted/23-rune-etched-brass-orb.png" alt="Латунная сфера с рунами">
          <img class="small" src="icons/painted/23-rune-etched-brass-orb.png" alt="" width="64" height="64">
        </div>
        <figcaption>
          <span class="name">Латунная сфера с рунами</span>
          <span class="meta">icons/painted/23-rune-etched-brass-orb.png · d100: 23</span>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="preview">
          <img src="icons/painted/43-silver-bell-without-clapper.png" alt="Серебряный колокольчик без язычка">
          <img class="small" src="icons/painted/43-silver-bell-without-clapper.png" alt="" width="64" height="64">
        </div>
        <figcaption>
          <span class="name">Серебряный колокольчик без язычка</span>
          <span class="meta">icons/painted/43-silver-bell-without-clapper.png · d100: 43</span>
        </figcaption>
      </figure>
      <figure class="card">
        <div class="preview">
          <img src="icons/painted/44-gnomish-canary-lamp.png" alt="Механический канарейка в гномьем фонаре">
          <img class="small" src="icons/painted/44-gnomish-canary-lamp.png" alt="" width="64" height="64">
        </div>
        <figcaption>
          <span class="name">Механический канарейка в гномьем фонаре</span>
          <span class="meta">icons/painted/44-gnomish-canary-lamp.png · d100: 44</span>
        </figcaption>
      </figure>
  </div>
</body>
</html>
